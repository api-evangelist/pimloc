aid: pimloc
name: Pimloc
description: >-
  Pimloc is a UK-based AI company whose Secure Redact platform automates the
  redaction and anonymization of personally identifiable information (PII) in
  video, audio, images and documents — blurring faces, license plates, screens,
  on-screen text and full bodies with high accuracy. Used across law enforcement,
  local government, transport, insurance, healthcare, education and retail to
  meet GDPR, CCPA, HIPAA, FOIA and DSAR obligations, Secure Redact offers a
  browser SaaS and a v3 REST API. The API supports a fully automated Standard
  Flow (upload by URL, process, download) and an Enterprise Flow (review and edit
  in the UI, with projects, users and audit/chain-of-custody trails), plus audio
  transcription, video search and webhook callbacks. Pimloc is backed by
  Speedinvest.
