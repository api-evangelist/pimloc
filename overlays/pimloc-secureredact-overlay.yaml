overlay: 1.0.0
info:
  title: API Evangelist enhancements for Secure Redact API
  version: 1.0.0
extends: openapi/secureredact-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: pimloc
      x-apievangelist-product: Secure Redact
      x-apievangelist-category: [video-redaction, privacy, pii, anonymization]
      x-apievangelist-source: https://docs.secureredact.co.uk
  - target: $.info
    update:
      x-apievangelist-auth-model: token-exchange (HTTP Basic -> JWT bearer)
  - target: $.info
    update:
      x-apievangelist-webhooks: [state_callback, export_callback]
